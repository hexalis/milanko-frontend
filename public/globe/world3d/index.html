<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorador · Mundo 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Tokens copied from portal/styles.css (Evidence Ledger), so view B matches view A. */
  :root { --surface: #ffffff; --surface-2: #f2f3ff; --surface-3: #e9edff; --ink: #0d1b36; --ink-2: #3f4250; --muted: #585c68; --line: #e1e4f0;
    --rail: #101c2f; --rail-ink: #a3aec2; --accent: #4b44c9; --glow: #a9b4ff; --space: #0a0e1c; --space-line: #232d48; --sector: #8ff0d8;
    --dur-press: 100ms; --dur-fast: 150ms; --dur-base: 200ms; --dur-panel: 300ms; --dur-leave: 200ms; --dur-large: 400ms; --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-in: cubic-bezier(0.55, 0, 1, 0.45);
    --serif: "Noto Serif", Georgia, serif; --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--space); color: #e7ebf5; font-family: var(--sans); overflow: hidden; }
  button { font: inherit; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  .ic { width: 18px; height: 18px; flex: none; }
  .lbl { padding: 3px 8px; border-radius: 999px; background: rgba(10, 14, 28, 0.7); font-size: 12px; font-weight: 600; white-space: nowrap; margin: -8px 0 0 19px; pointer-events: none; transition: opacity var(--dur-fast) var(--ease-out); }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--rail-ink); z-index: 4; transition: opacity 400ms var(--ease-out); text-align: center; padding: 24px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* Search and regions (same as view A) */
  .gx-search { position: fixed; top: 24px; left: 24px; z-index: 6; width: min(440px, calc(100% - 48px)); }
  .gx-search__field { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px 0 18px; border-radius: 999px; background: rgba(10, 14, 28, 0.92); border: 1px solid var(--space-line); color: var(--rail-ink); transition: border-color var(--dur-fast) var(--ease-out); }
  .gx-search__field:focus-within { border-color: var(--glow); }
  .gx-search input { flex: 1; min-width: 0; border: 0; background: none; color: #fff; font: 400 15px var(--sans); outline: none; }
  .gx-search input::placeholder { color: #8e99b0; }
  .gx-search kbd { color: var(--rail-ink); font: 500 12px var(--mono); border: 1px solid var(--space-line); border-radius: 6px; padding: 2px 6px; }
  .gx-results { margin-top: 8px; max-height: 50vh; overflow-y: auto; padding: 6px; border-radius: 24px; background: rgba(10, 14, 28, 0.96); border: 1px solid var(--space-line); }
  .gx-results[hidden] { display: none; }
  .gx-results p { margin: 8px 10px 4px; font-size: 12px; color: #95a1b7; }
  .gx-opt { width: 100%; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 0; border-radius: 8px; background: none; color: #e7ebf5; text-align: left; cursor: pointer; }
  .gx-opt span { font-size: 13px; color: #a3aec2; }
  .gx-opt:hover, .gx-opt.is-active { background: rgba(169, 180, 255, 0.12); }
  .gx-regions { position: fixed; top: 84px; left: 24px; z-index: 5; display: flex; gap: 6px; max-width: calc(100% - 200px); overflow-x: auto; scrollbar-width: none; padding-right: 24px; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent); }
  .gx-regions button { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 12px; border: 1px solid var(--space-line); border-radius: 999px; background: rgba(10, 14, 28, 0.85); color: var(--rail-ink); font: 500 13px var(--sans); cursor: pointer; transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
  .gx-regions .num { font-size: 12px; color: #95a1b7; }
  .gx-regions button:hover { color: #fff; background: #22324e; }
  .gx-regions button[aria-pressed="true"] { background: var(--sector); border-color: var(--sector); color: var(--rail); }
  .gx-regions button[aria-pressed="true"] .num { color: var(--rail); }
  .gx-search:has(.gx-results:not([hidden])) ~ .gx-regions { visibility: hidden; }

  /* Tools: view switch (A Points · B 3D world) and the zoom pill */
  .gx-tools { position: fixed; top: 24px; right: 24px; z-index: 6; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; transition: transform var(--dur-leave) var(--ease-in); }
  .zoom { display: flex; flex-direction: column; gap: 2px; padding: 4px; background: rgba(10, 14, 28, 0.85); border: 1px solid var(--space-line); border-radius: 999px; }
  .zoom button { width: 36px; height: 36px; display: grid; place-items: center; background: none; border: 0; color: #e2e8f0; border-radius: 9999px; cursor: pointer; transition: background var(--dur-fast) var(--ease-out); }
  .zoom button:hover { background: rgba(255, 255, 255, 0.08); }

  /* Dock: layer switch and Settings; what the globe shows, with its key; the time machine */
  .gx-dock { position: fixed; left: 50%; bottom: 24px; z-index: 5; transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; width: min(720px, calc(100% - 48px)); padding: 12px; border-radius: 24px; background: rgba(10, 14, 28, 0.92); border: 1px solid var(--space-line); transition: transform var(--dur-leave) var(--ease-in), width var(--dur-leave) var(--ease-in), opacity var(--dur-leave) var(--ease-in); container: dock / inline-size; }
  .gx-dock__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .gx-dock__layers { display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); min-width: 0; }
  .gx-dock__layers button { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 14px; border: 0; border-radius: 999px; background: none; color: var(--rail-ink); font: 600 13px var(--sans); cursor: pointer; white-space: nowrap; transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
  .gx-dock__layers button .num { font-size: 12px; }
  .gx-dock__layers button:hover { color: #fff; }
  .gx-dock__layers button[aria-pressed="true"] { background: var(--glow); color: var(--rail); }
  .live-dot { width: 7px; height: 7px; border-radius: 9999px; background: var(--sector); display: inline-block; }
  .gx-dock__fbtn { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 14px; border: 1px solid var(--space-line); border-radius: 999px; background: none; color: var(--rail-ink); font: 600 13px var(--sans); cursor: pointer; transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out); }
  .gx-dock__fbtn:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
  .gx-dock__fbtn.is-on, .gx-dock__fbtn[aria-expanded="true"] { border-color: var(--glow); color: #fff; }
  .gx-dock__badge { min-width: 18px; height: 18px; display: inline-grid; place-items: center; padding: 0 5px; border-radius: 999px; background: var(--glow); color: var(--rail); font-size: 12px; font-weight: 600; }
  .gx-dock__badge[hidden] { display: none; }
  .gx-dock__info { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; padding: 0 4px; }
  .gx-dock__say { margin: 0; font-size: 15px; color: #e7ebf5; line-height: 1.45; }
  .gx-dock__say strong { color: #fff; font-weight: 600; }
  .legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; color: #cbd5e1; font-size: 13px; }
  .legend li { display: flex; align-items: center; gap: 7px; }
  .hexdot { width: 12px; height: 12px; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); display: inline-block; flex: none; }
  .dot { width: 9px; height: 9px; border-radius: 9999px; display: inline-block; flex: none; }
  .tri-up { width: 0; height: 0; border: 6px solid transparent; border-bottom: 10px solid #ec6896; border-top: 0; }
  .tri-down { width: 0; height: 0; border: 6px solid transparent; border-top: 10px solid #2eaac4; border-bottom: 0; }
  .ring { width: 10px; height: 10px; border-radius: 99px; border: 2px dashed #c3cad9; }
  .diamond { width: 9px; height: 9px; border-radius: 3px; transform: rotate(45deg); background: #ff8a4c; box-shadow: 0 0 0 1.5px #fff; }
  .gx-dock__src { margin: -4px 4px 0; font-size: 12px; color: #8e99b0; }
  .gx-dock__time { display: flex; align-items: center; gap: 12px; padding: 0 4px; }
  .gx-dock__time .gx-dock__range { flex: 1; }
  .gx-dock__time[hidden] { display: none; }
  .timebar__play { width: 42px; height: 42px; display: grid; place-items: center; border: 0; border-radius: 9999px; background: var(--glow); color: var(--rail); cursor: pointer; transition: transform var(--dur-press) var(--ease-out), background var(--dur-fast) var(--ease-out); }
  .timebar__play:hover { background: #c3cbff; }
  .timebar__play:active { transform: scale(0.94); }
  .now { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border: 1px solid var(--space-line); border-radius: 999px; background: none; color: var(--rail-ink); font: 600 13px var(--sans); cursor: pointer; }
  .now[hidden] { display: none; }
  .now[aria-pressed="true"] { background: rgba(143, 240, 216, 0.14); border-color: var(--sector); color: #fff; }
  .gx-dock__range { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .gx-dock__what { font-size: 12px; color: #95a1b7; }
  .gx-dock__range input { width: 100%; accent-color: var(--glow); }
  .gx-dock__range.is-off input { opacity: 0.45; }
  .gx-dock__year { font-size: 20px; color: var(--glow); min-width: 3em; text-align: right; }

  /* Settings panel above the dock: what to show, world detail */
  .gx-panel { position: absolute; right: 0; bottom: calc(100% + 10px); width: min(420px, 100%); max-height: min(560px, calc(100vh - 320px)); overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 18px; padding: 16px; border-radius: 24px; background: rgba(10, 14, 28, 0.97); border: 1px solid var(--space-line); animation: panel-in var(--dur-panel) var(--ease-out); }
  .gx-panel[hidden] { display: none; }
  @keyframes panel-in { from { opacity: 0; transform: translateY(8px); } }
  .gx-panel__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: -8px; }
  .gx-panel h2 { margin: 0; font: 600 15px var(--sans); color: #fff; }
  .gx-panel h3 { margin: 0 0 4px; font: 600 13px var(--sans); color: #fff; }
  .gx-panel__note { margin: 0 0 10px; font-size: 13px; color: #a3aec2; }
  .x { width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 9999px; background: none; color: var(--rail-ink); cursor: pointer; }
  .x:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 14px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, 0.06); color: var(--rail-ink); font: 500 13px var(--sans); cursor: pointer; transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
  .chips button:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }
  .chips button[aria-pressed="true"] { background: var(--glow); color: var(--rail); }
  .chips .num { font-size: 12px; }
  .gx-data { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; padding: 10px 0 0; }
  .gx-data[hidden] { display: none; }
  .gx-data label { display: grid; gap: 4px; font: 600 12px var(--sans); color: #95a1b7; }
  .gx-data select, .gx-data input { min-height: 36px; padding: 6px 10px; border: 1px solid var(--space-line); border-radius: 10px; background: rgba(10, 14, 28, 0.92); color: #e7ebf5; font: 500 13px var(--sans); }
  .gx-data__top { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
  .gx-data__top a { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 4px 10px; border: 1px solid var(--space-line); border-radius: 999px; color: var(--rail-ink); font: 500 12px var(--sans); text-decoration: none; }
  .gx-data__top a:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
  .toggle { display: flex; align-items: center; justify-content: space-between; min-height: 44px; font-size: 15px; color: #e7ebf5; cursor: pointer; }
  .toggle input { appearance: none; width: 44px; height: 26px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); position: relative; cursor: pointer; transition: background var(--dur-fast) var(--ease-out); }
  .toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 999px; background: #fff; transition: transform var(--dur-panel) var(--ease-out); }
  .toggle input:checked { background: var(--glow); }
  .toggle input:checked::after { transform: translateX(18px); }
  .gx-panel__foot { position: sticky; bottom: -16px; display: flex; align-items: center; justify-content: flex-end; gap: 16px; margin: 0 -16px -16px; padding: 12px 16px 16px; border-top: 1px solid var(--space-line); background: #0a0e1c; }
  .linklike { border: 0; background: none; color: var(--glow); font: 600 14px var(--sans); cursor: pointer; padding: 0; }
  .linklike[hidden] { display: none; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; font: 600 14px var(--sans); cursor: pointer; text-decoration: none; transition: transform var(--dur-press) var(--ease-out); }
  .btn:active { transform: scale(0.97); }
  .btn--glow { background: var(--glow); color: var(--rail); }
  .btn--primary { background: var(--rail); color: #fff; }
  .btn--ghost { background: var(--surface-3); color: var(--ink); }

  /* Card: the same light drawer as view A, for whatever was tapped */
  .card { position: fixed; top: 16px; right: 16px; bottom: 16px; z-index: 7; width: min(380px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 14px; padding: 28px 24px 24px; border-radius: 24px; background: var(--surface); color: var(--ink); box-shadow: 0 24px 48px -24px rgba(0, 0, 0, 0.6); transform: translateX(calc(100% + 24px)); transition: transform var(--dur-leave) var(--ease-in); overflow-y: auto; }
  .card.is-open { transform: none; transition-duration: var(--dur-panel); transition-timing-function: var(--ease-out); }
  .card[hidden] { display: none; }
  .card .x { position: absolute; top: 14px; right: 14px; background: var(--surface-3); color: var(--ink); width: 40px; height: 40px; }
  .card__kind { margin: 0; font-size: 13px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
  .card h2 { margin: 0; padding-right: 40px; font: 600 26px/1.25 var(--sans); }
  .card__body { font-size: 15px; color: var(--ink-2); line-height: 1.6; }
  .card__body strong { display: none; }
  .card__facts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-radius: 8px; background: var(--surface-2); }
  .card__facts li { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 15px; color: var(--ink); }
  .card__facts li:first-child { border-top: 0; }
  .card h2:focus { outline: none; }
  @media (min-width: 861px) { .gx:has(.card.is-open) .gx-regions { max-width: calc(100% - 640px); } }
  .card__src { margin: 0; font-size: 13px; color: var(--muted); }
  .card__actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 8px; }
  @media (min-width: 861px) {
    .gx:has(.card.is-open) .gx-tools { transform: translateX(-404px); }
    .gx:has(.card.is-open) .gx-dock { transform: translateX(calc(-50% - 200px)); width: min(720px, calc(100% - 460px)); }
  }
  /* In the portal its drawer covers the right of this frame (--cover-r, from setCover): the controls move out from
     under it with the drawer's own timing, and come back as it leaves. */
  .gx.is-covered .gx-tools { transform: translateX(calc(-1 * var(--cover-r))); }
  .gx.is-covered .gx-dock { transform: translateX(calc(-50% - var(--cover-r) / 2)); width: min(720px, calc(100% - 48px - var(--cover-r))); }
  .gx.is-covered .gx-search { width: min(440px, calc(100% - 48px - var(--cover-r))); }
  .gx.is-covered .gx-regions { max-width: calc(100% - 120px - var(--cover-r)); }
  .gx.is-covered :is(.gx-tools, .gx-dock) { transition-duration: var(--dur-panel); transition-timing-function: var(--ease-out); }
  /* A bottom sheet covers the dock: it fades out with the sheet coming up and leaves the Tab order, as it does for
     this frame's own card. */
  .gx.is-sheet .gx-dock { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity var(--dur-panel) var(--ease-out), visibility 0s linear var(--dur-panel); }

  /* Caption over the lifted tile: what NASA EONET recorded inside it */
  .tilecap-at { width: 0; height: 0; pointer-events: none; opacity: 0; transition: opacity var(--dur-base) var(--ease-out); }
  .tilecap { position: absolute; left: 14px; top: 0; transform: translateY(-50%); width: max-content; max-width: 250px; padding: 10px 14px; border-radius: 14px; background: rgba(10, 14, 28, 0.92); border: 1px solid var(--space-line); color: #e7ebf5; font-size: 13px; line-height: 1.45; }
  .tilecap-at.is-still .tilecap { left: 44px; }   /* clear of the event icon that stands on the tile */
  .tilecap-at.is-left .tilecap { left: auto; right: 14px; }   /* placeCaption: no room on the right */
  .tilecap-at.is-still.is-left .tilecap { left: auto; right: 44px; }
  .tilecap-at.is-off { visibility: hidden; }   /* no room on either side: the portal's drawer shows the same facts */
  .tilecap-at.is-docked { position: fixed; bottom: 176px; left: 12px; right: 12px; width: auto; height: auto; z-index: 5; }   /* just above the dock: the lifted tile rides high on a phone */
  .tilecap-at.is-docked .tilecap { position: static; transform: none; max-width: none; width: auto; }
  .tilecap p { margin: 0; }
  .tilecap__k { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; color: #fff; }
  .tilecap__s { color: #b8c2d6; }
  .tilecap__src { margin-top: 4px !important; font-size: 12px; color: #8e99b0; }
  .tip { position: fixed; z-index: 8; padding: 8px 12px; border-radius: 8px; background: rgba(10, 14, 28, 0.92); border: 1px solid var(--space-line); font-size: 13px; line-height: 1.45; pointer-events: none; transform: translate(14px, 14px); max-width: 260px; }
  .tip[hidden] { display: none; }

  /* Phones: dock and panel as sheets, card as a bottom sheet that hides the dock */
  @media (max-width: 860px) {
    .gx-search { top: 12px; left: 12px; width: calc(100% - 24px); }
    .gx-regions { top: 72px; left: 12px; max-width: calc(100% - 12px); }
    .gx-tools { top: 124px; right: 12px; }
    .gx-dock { bottom: 12px; width: calc(100% - 24px); }
    .gx-dock__top .gx-dock__layers { flex: 1; }
    .gx-dock__layers button { flex: 1; justify-content: center; padding: 6px 8px; }
    .gx-dock__fbtn { min-width: 44px; min-height: 44px; justify-content: center; padding: 6px 10px; }
    .gx-dock__fbtn .lbl2 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .gx-dock__say { font-size: 13px; }
    .gx-dock__src { display: none; }
    .gx-panel { right: 0; left: 0; width: auto; bottom: 0; max-height: calc(100dvh - 180px); background: #0a0e1c; }
    .card { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 58%; transform: translateY(calc(100% + 16px)); }
    .card.is-open { transform: none; }
    .gx:has(.card.is-open) .gx-dock { opacity: 0; pointer-events: none; }
    .gx.is-covered .gx-search { width: calc(100% - 24px - var(--cover-r)); }
    .gx.is-covered .gx-regions { max-width: calc(100% - 12px - var(--cover-r)); }
    .gx.is-covered .gx-dock { width: calc(100% - 24px - var(--cover-r)); }
  }
  /* Phones held sideways (short and wide): the controls shrink to one row at the top and a small dock in the
     corner, so the world keeps most of the frame. The regions stay one search away (the search lists them). */
  @media (max-height: 480px) and (orientation: landscape) {
    .gx-search { top: 8px; left: 8px; width: min(320px, calc(50% - 16px)); }
    .gx-search__field { min-height: 44px; }
    .gx-regions { display: none; }
    .gx-tools { top: 8px; right: 8px; }
    .zoom { flex-direction: row; }
    .gx-dock { left: 8px; bottom: 8px; transform: none; width: min(440px, calc(100% - 16px)); padding: 8px 10px; gap: 6px; }
    .gx.is-covered .gx-dock { transform: none; width: min(440px, calc(100% - 16px - var(--cover-r))); }
    .gx.is-covered .gx-search { width: min(320px, calc(100% - 160px - var(--cover-r))); }
    .gx-dock__say { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .gx-dock__src { display: none; }
    .gx-dock__time { gap: 8px; }

  const ms = (performance.now() - t0) / n, g = renderer.info, seen = new Set(); let bytes = 0;
  scene.traverse(o => { const geo = o.geometry; if (!geo || seen.has(geo)) return; seen.add(geo); Object.values(geo.attributes).forEach(a => { bytes += a.array.byteLength; }); if (geo.index) bytes += geo.index.array.byteLength; if (o.isInstancedMesh) { bytes += o.instanceMatrix.array.byteLength + (o.instanceColor ? o.instanceColor.array.byteLength : 0); } });

};
// Probes for checks: what the base board holds inside a box, the tile drawn at a point, the level of detail,
// and the chosen tile (select() does what the portal's messages do).
const cellInfo = (c) => ({ level: c.level, lat: +c.lat.toFixed(2), lon: +c.lon.toFixed(2), biome: c.biome, elev: c.elev, h: +c.h.toFixed(4), km: tileKm(c), region: c.region, volcano: c.volcano ? c.volcano.map(v => v.name) : null, lake: c.lakeFrac ? +c.lakeFrac.toFixed(2) : 0 });
window.etdTiles = (la0, la1, lo0, lo1) => CELLS.filter(c => c.lat >= la0 && c.lat <= la1 && c.lon >= lo0 && c.lon <= lo1).map(cellInfo);
window.etdPick = (lat, lon) => { const c = pickCell(lat, lon); return c && cellInfo(c); };
window.etdLODoff = (v) => { LOD.off = !!v; LOD.last = 0; };
window.etdLOD = () => ({ shown: [...LOD.shown], ready: LOD.ready.size, loading: LOD.loading.size, fineCells: [...LOD.shown].reduce((s, r) => s + LOD.ready.get(r).cells.length, 0) });
window.etdSelect = (kind, lat, lon, ev) => { if (kind === 'none') { dropLift(); return; } flyTo(lat, lon); if (kind === 'point') requestLift(lat, lon, null); else requestLift(lat, lon, ev); };
window.etdLift = () => ({ cell: lift.cell && cellInfo(lift.cell), p: +lift.p.toFixed(3), to: lift.to, pending: !!lift.pending, info: lift.info, anim: lift.anim ? { visible: lift.anim.group.visible, children: lift.anim.group.children.length } : null, announce: $('announce').textContent });

/* ---------- Hover or tap: what this tile is, from NASA ---------- */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = document.getElementById('tip');
// The tile under a screen point: the first tile top (or side) the ray meets. Tiles stand up to 50 times their
// real height, so a fixed sphere just above the sea picked a tile hundreds of kilometres behind a mountain
// whenever the camera tilted. The ray walks the shell between the deepest sea step and the highest top: first
// in steps under half a base tile against base heights plus a margin (a fine tile can stand above its base
// tile), then from one step before that in steps under half a fine tile against the tile drawn there.
const TOP_MAX = R + LAND0 + 9000 * EXAG / EARTH_M, TOP_MIN = R + SEA_H.deep - 0.0005, FINE_MARGIN = 0.016;
const _hp = new THREE.Vector3();
const latLonOf = (v) => { const n = v.length(); return [Math.asin(Math.max(-1, Math.min(1, v.y / n))) * 180 / Math.PI, Math.atan2(v.x, v.z) * 180 / Math.PI]; };
// Distance along a ray to a sphere round the centre, on its near or far side (NaN when the ray misses it).
function sphereT(o, d, rad, far) { const b = o.dot(d), c = o.lengthSq() - rad * rad, disc = b * b - c; if (disc < 0) return NaN; const s = Math.sqrt(disc); return far ? -b + s : -b - s; }
function surfaceHit(rc) {
  // A low camera is already inside that shell (the highest tops stand 0.078 radii up): the walk starts at it.
  const o = rc.ray.origin, d = rc.ray.direction, t0 = o.lengthSq() < TOP_MAX * TOP_MAX ? 0 : sphereT(o, d, TOP_MAX, false);
  if (!(t0 >= 0)) return null;
  let t1 = sphereT(o, d, TOP_MIN, false); if (!(t1 >= 0)) t1 = sphereT(o, d, TOP_MAX, true);
  const coarse = avgR * 0.5, fine = avgR * fineScale() * 0.5;
  let start = -1;
  for (let t = t0; t <= t1 + coarse; t += coarse) {
    rc.ray.at(Math.min(t, t1), _hp); const [la, lo] = latLonOf(_hp), c = CELLS[cellIndex(la, lo)];
    if (c && _hp.length() <= R + c.h + FINE_MARGIN) { start = Math.max(t0, t - coarse); break; }
  }
  if (start < 0) return null;
  for (let t = start; t <= t1 + fine; t += fine) {
    rc.ray.at(Math.min(t, t1), _hp); const [la, lo] = latLonOf(_hp), c = pickCell(la, lo);
    if (c && _hp.length() <= R + c.h) return { cell: c, lat: la, lon: lo, distance: Math.min(t, t1) };
  }

}
// Probe for checks: the tile under a screen point, and how far its top centre lands from that point on screen.
window.etdHit = (x, y) => {
  mouse.set(x / innerWidth * 2 - 1, -y / innerHeight * 2 + 1); ray.setFromCamera(mouse, camera);
  const h = surfaceHit(ray); if (!h) return null;
  const s = h.cell.p.clone().multiplyScalar(R + h.cell.h).project(camera);
  return { ...cellInfo(h.cell), px: Math.round(Math.hypot((s.x + 1) / 2 * innerWidth - x, (1 - s.y) / 2 * innerHeight - y)) };
};
let hoverQueued = null, lastPointer = null, frameN = 0;
renderer.domElement.addEventListener('pointermove', (e) => { hoverQueued = e; });
renderer.domElement.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') hoverQueued = e; });
renderer.domElement.addEventListener('pointerleave', () => { tip.hidden = true; lastPointer = null; highlight(null); });
function hover(e) {
  mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const ground = surfaceHit(ray);
  let html = null;
  if (layer === 'cases') { const hit = ray.intersectObjects(markers.children.filter(o => o.isSprite && o.visible), false)[0]; if (hit) html = hit.object.userData.tip + `<br><span style="color:#a9b4c8">${T('Toca para acercarte')}</span>`; }
  if (layer === 'weather' && wxProxies.length) { const hit = ray.intersectObjects(wxProxies, false)[0]; if (hit && (!ground || hit.distance <= ground.distance + 0.05)) html = hit.object.userData.tip + `<br><span style="color:#a9b4c8">${T('Toca para acercarte')}</span>`; }
  let tileHit = false;
  if (!html) {
    if (ground) { const c = ground.cell; highlight(c); tileHit = true;
      if (c) html = (c.volcano ? `<strong>${c.volcano.map(v => v.name).join(' · ')}</strong><br>${T('Volcán con actividad en EONET')} ${c.volcano.map(v => v.first === v.last ? v.first : `${v.first}–${v.last}`).join(' · ')}<br>` : '') + `<strong>${BIOME[c.biome].name}</strong><br>${c.water ? T('Agua') : c.elev === null ? T('Sin dato de elevación') : F(`Altura media ${nf(Math.round(c.elev))} m`, `Mean height ${nf(Math.round(c.elev))} m`)}${c.biome === 'ice' && c.elev !== null ? I18N.t('w3.tile.iceNote') : ''}<br><span style="color:#a9b4c8">${c.lat.toFixed(1)}°, ${c.lon.toFixed(1)}°</span>`; }
  }
  if (!tileHit) highlight(null);
  if (html) { tip.innerHTML = html; tip.style.left = Math.min(e.clientX, innerWidth - 220) + 'px'; tip.style.top = Math.min(e.clientY, innerHeight - 120) + 'px'; tip.hidden = false; } else tip.hidden = true;
}

/* ---------- Loop ---------- */
const clock = new THREE.Clock(), wn = new THREE.Vector3(), cp = new THREE.Vector3();
let loopN = 0;
function frame() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  const now = performance.now();
  stepCamera(dt, now); stepInset(dt); updateRegions(); updateLOD(now); stepLift(now, dt, t);
  // With the keyboard on the globe, the tile Enter would pick is outlined.
  if (kbdFocus && (loopN++ % 8 === 0)) highlight(pickCell(cam.lat, cam.lon));
  placeSun();
  if (!REDUCED) uTime.value = t;
  if (!REDUCED) [lavaMat, PROP_MAT[1].lava.mat].forEach(m => { m.emissiveIntensity = 1.2 + 0.5 * Math.sin(t * 2.2); });
  starMats.forEach(m => { m.uniforms.t.value = t; });
  planet.rotation.y += dt * 0.05;
  if ((wx.visible || lift.anim) && !REDUCED) wxTime.value = t;
  if (wx.visible && !REDUCED) wxAnim.forEach(f => f(dt, t));
  const cloudFade = cloudsWanted ? THREE.MathUtils.smoothstep(camera.position.length() - R, 0.3, 0.5) : 0;
  clouds.visible = cloudFade > 0.01; cloudMat.opacity = 0.95 * cloudFade;
  if (!REDUCED) clouds.children.forEach(pv => pv.rotateOnAxis(pv.userData.axis, pv.userData.speed * dt));
  if (hl) hlMat.opacity = REDUCED ? 0.85 : 0.6 + 0.35 * (0.5 + 0.5 * Math.sin(t * 4));
  if (evMesh && Math.abs(evTarget - evNow) > 0.001) { evNow += (evTarget - evNow) * (REDUCED ? 1 : 1 - Math.pow(0.0008, dt)); placeColumns(); if (evTarget === 0 && evNow < 0.01) evMesh.visible = false; }
  // A point is on the visible cap when its dot with the camera direction beats R / distance (the horizon).
  // The margin keeps pins off the very edge of the disc; close to the ground it shrinks, or nothing would show.
  cp.copy(camera.position).normalize(); const camR = camera.position.length(), hzM = Math.min(1, (camR - R) / 2), hz = R / camR + 0.06 * hzM;
  if (markers.visible) markers.children.forEach(o => { if (o.isSprite) o.visible = (themeF === 'all' || o.userData.theme === themeF) && wn.copy(o.position).normalize().dot(cp) > hz; });
  caseLabels.forEach(({ el, n, theme }) => { const d = n.dot(cp); el.style.opacity = layer === 'cases' && (themeF === 'all' || theme === themeF) && d > hz + 0.05 * hzM ? Math.min(1, (d - hz - 0.05 * hzM) / (0.15 * hzM + 0.01)) : 0; });
  if (sky.visible && !REDUCED) { nextComet -= dt; if (nextComet <= 0) { spawnComet(); nextComet = 5 + Math.random() * 6; } }
  for (let i = comets.length - 1; i >= 0; i--) {
    const c = comets[i]; c.life += dt; c.head.addScaledVector(c.vel, dt); c.trail.unshift(c.head.clone()); c.trail.length = 24;
    const a = c.line.geometry.attributes.position; c.trail.forEach((p, k) => a.setXYZ(k, p.x, p.y, p.z)); a.needsUpdate = true;
    c.line.material.opacity = Math.max(0, Math.min(1, c.life * 4, (c.max - c.life) * 3));
    if (c.life > c.max) { scene.remove(c.line); c.line.geometry.dispose(); comets.splice(i, 1); }
  }
  if (hoverQueued) { hover(hoverQueued); lastPointer = hoverQueued; hoverQueued = null; } else if (lastPointer && !tip.hidden && (frameN++ % 6 === 0)) hover(lastPointer);
  renderer.render(scene, camera); labels.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); const wasHome = Math.abs(goal.alt - homeAlt) < 0.05; fitCamera(); if (wasHome) goal.alt = homeAlt; renderer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight); markers.children.forEach(o => { if (o.isSprite) o.scale.setScalar(pinScale(o.userData.px)); }); if (lift.cap) lift.capSide = undefined; });
</script>
