# Hooks locales: la misma barrera que CI, antes de que el código salga de la máquina.
# Se instalan solos con `pnpm install` (script `prepare`). Saltar un hook (`--no-verify`)
# no evita CI: sólo retrasa el error. Los scripts viven en `.lefthook/<hook>/`.

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{js,jsx,ts,tsx,mjs,mts,cjs,json,css,md,yml,yaml,html}"
      # One thread: oxfmt 0.78 crashes now and then on Windows with many (access violation on exit).
      run: pnpm exec oxfmt --threads=1 --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{js,jsx,ts,tsx,mjs,mts,cjs}"
      # The same paths .oxlintrc.json ignores: oxlint fails with "No files found" when a commit
      # only stages files it ignores (e.g. the vendored globe), so they never reach it.
      exclude:
        - "public/globe/**"
      run: pnpm exec oxlint --deny-warnings {staged_files}
    - name: secrets
      script: secrets.sh
      runner: sh

commit-msg:
  jobs:
    - name: conventional-commit
      script: conventional-commit.sh
      runner: sh

pre-push:
  jobs:
    - name: check
      run: pnpm check
