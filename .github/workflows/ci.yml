name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: hexalis/github-workflows/.github/workflows/node-ci.yml@main
    with:
      package-manager: pnpm
      node-version: "24"
      install-command: pnpm install --frozen-lockfile
      test-command: pnpm check
      build-command: pnpm build
      e2e-install-command: pnpm exec playwright install --with-deps chromium
      e2e-command: pnpm test:e2e
      security-command: |
        pnpm audit --prod --audit-level high
        docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
      dependency-review: true
